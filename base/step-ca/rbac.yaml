apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: step-ca
rules:
  # The step-ca-init initContainer reads step-server-ca and the
  # provisioner-password Secrets by name (get), and creates any that are
  # missing with `kubectl create` - deliberately not `apply`, so that a
  # Secret created by a concurrently running init (e.g. an old pod's
  # initContainer still finishing as its replacement starts) is reported
  # as a conflict instead of silently overwritten. Nothing lists,
  # updates, or patches Secrets.
  #
  # get is limited to the Secrets the script manages. The
  # step-provisioner-* names must match STEP_SERVER_PROVISIONER_NAME and
  # STEP_IDRAC_PROVISIONER_NAME in step.env.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - step-server-ca
      - step-provisioner-server
      - step-provisioner-idrac
    verbs: ["get"]
  # create can't be restricted by resourceNames (the object doesn't exist
  # yet when it's authorized), so it is namespace-wide. Scoped to the
  # step-ca namespace only - this ServiceAccount has no access to Secrets
  # anywhere else in the cluster.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # The step-ca-init initContainer also publishes the step-root-ca
  # fingerprint to a ConfigMap (create_fingerprint_configmap), for
  # clients bootstrapping against this CA without their own cluster API
  # access. create-only, namespace-wide, for the same reason as the
  # Secret create rule above; nothing gets, lists, updates, or patches
  # ConfigMaps.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: step-ca
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: step-ca
subjects:
  - kind: ServiceAccount
    name: step-ca
