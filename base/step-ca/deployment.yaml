apiVersion: apps/v1
kind: Deployment
metadata:
  name: step-ca
spec:
  replicas: 1
  # step-data is ReadWriteOnce: a RollingUpdate would start the new pod
  # before stopping the old one, which hangs on Multi-Attach whenever the
  # new pod lands on a different node.
  strategy:
    type: Recreate
  template:
    spec:
      serviceAccountName: step-ca
      # Only the step-ca-init initContainer needs API access (to read and
      # write the step-server-ca/step-provisioner-* Secrets); it gets the
      # ServiceAccount token through the step-ca-init-token volume below.
      # The network-facing step-ca container gets no token at all.
      automountServiceAccountToken: false
      volumes:
        - name: step-data
          persistentVolumeClaim:
            claimName: step-data
        - name: step-scripts
          configMap:
            name: step-scripts
        - name: step-root-ca
          secret:
            # tls.crt must always be present; tls.key/password may be
            # absent after the documented post-init secret swap, so the
            # whole secret is mounted and init-step-ca.sh checks for the
            # individual files itself rather than restricting via items.
            secretName: step-root-ca
        - name: step-ca-init-token
          # Same layout as the default ServiceAccount token mount, so
          # kubectl's in-cluster config finds it at the usual path.
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
      initContainers:
        - name: step-ca-init
          image: docker.io/smallstep/step-ca
          volumeMounts:
            - name: step-data
              mountPath: /home/step
            - name: step-scripts
              mountPath: /scripts
            - name: step-root-ca
              mountPath: /step/root-ca
            - name: step-ca-init-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          command:
            - bash
            - /scripts/init-step-ca.sh
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: step-config
      containers:
        - name: step-ca
          image: docker.io/smallstep/step-ca
          ports:
            - containerPort: 9000
              name: api
          volumeMounts:
            - name: step-data
              mountPath: /home/step
          envFrom:
            - configMapRef:
                name: step-config
