apiVersion: apps/v1
kind: Deployment
metadata:
  name: step-ca
spec:
  replicas: 1
  template:
    spec:
      serviceAccountName: step-ca
      volumes:
        - name: step-data
          persistentVolumeClaim:
            claimName: step-data
        - name: step-scripts
          configMap:
            name: step-scripts
        - name: step-root-ca
          secret:
            # tls.crt must always be present; tls.key/password may be
            # absent after the documented post-init secret swap, so the
            # whole secret is mounted and init-step-ca.sh checks for the
            # individual files itself rather than restricting via items.
            secretName: step-root-ca
        - name: step-server-ca
          secret:
            # Generated by the initContainer on first run if absent.
            secretName: step-server-ca
            optional: true
        - name: step-provisioner-server
          secret:
            # Generated by the initContainer on first run if absent.
            secretName: step-provisioner-server
            optional: true
        - name: step-provisioner-idrac
          secret:
            # Generated by the initContainer on first run if absent.
            secretName: step-provisioner-idrac
            optional: true
      initContainers:
        - name: step-ca-init
          image: docker.io/smallstep/step-ca
          volumeMounts:
            - name: step-data
              mountPath: /home/step
            - name: step-scripts
              mountPath: /scripts
            - name: step-root-ca
              mountPath: /step/root-ca
            - name: step-server-ca
              mountPath: /step/server-ca
            - name: step-provisioner-server
              mountPath: /step/provisioner-server
            - name: step-provisioner-idrac
              mountPath: /step/provisioner-idrac
          command:
            - bash
            - /scripts/init-step-ca.sh
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: step-config
      containers:
        - name: step-ca
          image: docker.io/smallstep/step-ca
          ports:
            - containerPort: 9000
              name: api
          volumeMounts:
            - name: step-data
              mountPath: /home/step
          envFrom:
            - configMapRef:
                name: step-config
