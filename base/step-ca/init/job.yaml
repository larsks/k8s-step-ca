apiVersion: batch/v1
kind: Job
metadata:
  name: step-ca-init
spec:
  # Clean up promptly: this Job's pod is the only place the root key is
  # ever mounted, so don't leave it sitting around (with its volumes)
  # after it's done.
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: step-data
          persistentVolumeClaim:
            claimName: step-data
        - name: step-scripts
          configMap:
            name: step-scripts
        - name: step-password
          secret:
            secretName: step-password
        - name: step-root-certificate
          secret:
            secretName: step-root-certificate
        - name: step-intermediate-certificate
          secret:
            secretName: step-intermediate-certificate
      containers:
        - name: step-ca-init
          image: docker.io/smallstep/step-ca
          volumeMounts:
            - name: step-data
              mountPath: /home/step
            - name: step-scripts
              mountPath: /scripts
            - name: step-password
              mountPath: /step/password
            - name: step-root-certificate
              mountPath: /step/ca
            - name: step-intermediate-certificate
              mountPath: /step/intermediate
          command:
            - bash
            - /scripts/init-step-ca.sh
          envFrom:
            - configMapRef:
                name: step-config
          env:
            - name: STEP_PASSWORD_FILE
              value: /step/password/STEP_PASSWORD
            - name: STEP_CA_CERTIFICATE_FILE
              value: /step/ca/tls.crt
            - name: STEP_CA_KEY_FILE
              value: /step/ca/tls.key
            - name: STEP_CA_KEY_PASSWORD_FILE
              value: /step/ca/password
            - name: STEP_CA_INTERMEDIATE_CERTIFICATE_FILE
              value: /step/intermediate/tls.crt
            - name: STEP_CA_INTERMEDIATE_KEY_FILE
              value: /step/intermediate/tls.key
