apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: step-ca
labels:
  - pairs:
      app: step-ca
    includeSelectors: true
resources:
  - namespace.yaml
  - deployment.yaml
  - pvc.yaml
  - service.yaml
  - ingress.yaml
  - serviceaccount.yaml
  - rbac.yaml

configMapGenerator:
  - name: step-scripts
    options:
      disableNameSuffixHash: true
    files:
      - init-step-ca.sh
      - idrac-rsa.tpl

  - name: step-config
    options:
      # init/job.yaml references this ConfigMap by name from a separate
      # kustomize build, which only resolves if the name is stable rather
      # than content-hashed.
      disableNameSuffixHash: true
    envs:
      - step.env
