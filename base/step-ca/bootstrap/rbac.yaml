apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: step-ca-bootstrap
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # get/list: read an optional step-ca-restore Secret, supplied by an
    # operator restoring from an offline backup.
    # create/update/patch: write the step-ca-bootstrap-* Secrets that the
    # PushSecrets alongside this Job copy into the real external store.
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: step-ca-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: step-ca-bootstrap
subjects:
  - kind: ServiceAccount
    name: step-ca-bootstrap
