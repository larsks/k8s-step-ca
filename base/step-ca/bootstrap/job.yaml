apiVersion: batch/v1
kind: Job
metadata:
  name: step-ca-bootstrap
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: step-ca-bootstrap
      restartPolicy: OnFailure
      volumes:
        - name: step-ca-bootstrap-script
          configMap:
            name: step-ca-bootstrap-script
      containers:
        - name: step-ca-bootstrap
          image: docker.io/smallstep/step-cli
          command:
            - sh
            - /scripts/bootstrap-ca.sh
          volumeMounts:
            - name: step-ca-bootstrap-script
              mountPath: /scripts
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
