apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-secrets

resources:
  - namespace.yaml

helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    releaseName: external-secrets
    version: 2.11.0
    valuesInline:
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 512Mi
