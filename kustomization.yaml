apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app: step-ca
    includeSelectors: true
resources:
  - deployment.yaml
  - pvc.yaml
  - service.yaml

configMapGenerator:
  - name: step-scripts
    options:
      disableNameSuffixHash: true
    files:
      - init-step-ca.sh

  - name: step-config
    envs:
      - step.env

secretGenerator:
  - name: step-password
    literals:
      - STEP_PASSWORD=supersecret

  - name: step-root-certificate
    type: kubernetes.io/tls
    files:
      - tls.crt=certs/root_ca.crt
      - tls.key=certs/root_ca.key
    literals:
      - password=supersecret
