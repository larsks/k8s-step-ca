apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: step-ca-bootstrap-intermediate-certificate
  namespace: step-ca
spec:
  secretStoreRefs:
    - name: step-ca-secrets
      kind: ClusterSecretStore
  selector:
    secret:
      name: step-ca-bootstrap-intermediate-certificate
  data:
    - match:
        secretKey: tls.crt
        remoteRef:
          remoteKey: step-intermediate-certificate
          property: tls.crt
    - match:
        secretKey: tls.key
        remoteRef:
          remoteKey: step-intermediate-certificate
          property: tls.key
