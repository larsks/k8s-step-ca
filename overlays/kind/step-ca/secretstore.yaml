apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  # kind-local stand-in for an external vault/password-manager store. A
  # production overlay would replace this with a ClusterSecretStore
  # pointed at the real backend instead.
  name: step-ca-secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: step-ca-secrets
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: kube-public
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
