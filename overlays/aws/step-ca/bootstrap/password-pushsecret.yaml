apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: step-ca-bootstrap-password
  namespace: step-ca
spec:
  secretStoreRefs:
    - name: step-ca-secrets
      kind: ClusterSecretStore
  selector:
    secret:
      name: step-ca-bootstrap-password
  data:
    - match:
        secretKey: STEP_PASSWORD
        remoteRef:
          remoteKey: step-ca/password
          property: STEP_PASSWORD
