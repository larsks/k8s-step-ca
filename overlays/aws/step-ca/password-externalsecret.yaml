apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: step-password
  namespace: step-ca
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: step-ca-secrets
  target:
    name: step-password
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: step-ca/password
