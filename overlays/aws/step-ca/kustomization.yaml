apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/step-ca/
  - secretstore.yaml
  - password-externalsecret.yaml
  - root-certificate-externalsecret.yaml
  - intermediate-certificate-externalsecret.yaml

# step-ca/password, step-ca/root-certificate, and
# step-ca/intermediate-certificate are expected to already exist in AWS
# Secrets Manager - see bootstrap/README.md for how to put them there.
