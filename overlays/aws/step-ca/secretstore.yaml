apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: step-ca-secrets
spec:
  provider:
    aws:
      # TODO: set to the region the Secrets Manager secrets actually live
      # in.
      region: us-east-1
      service: SecretsManager
      sessionTagsPolicy: None
      # No explicit auth block: this relies on IRSA - the external-secrets
      # ServiceAccount (external-secrets/external-secrets) needs an
      # eks.amazonaws.com/role-arn annotation for a role that can
      # GetSecretValue on step-ca/password, step-ca/root-certificate, and
      # step-ca/intermediate-certificate (and PutSecretValue/CreateSecret
      # on the same, for the bootstrap PushSecrets). That role and
      # annotation are provisioned outside this repo.
