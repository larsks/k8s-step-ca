apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: step-root-certificate
  namespace: step-ca
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: step-ca-secrets
  target:
    name: step-root-certificate
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  dataFrom:
    - extract:
        key: step-ca/root-certificate
